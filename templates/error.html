{% extends "base.html" %}

{% block title %}{{ error_code }} - {{ error_title }} — Swedavia FlightInfo{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-8 col-lg-6 text-center">
    <div class="card border-0 rounded-4 shadow-sm p-4 p-md-5">
      <div class="display-1 fw-bold text-primary mb-3">{{ error_code }}</div>
      <h3 class="fw-bold mb-2">{{ error_title }}</h3>
      <p class="text-muted mb-4">{{ error_message }}</p>
      <div>
        <a href="{{ url_for('index') }}" class="btn btn-primary rounded-pill px-4 py-2 fw-semibold">
          <i class="bi bi-house-door me-1"></i> Return to Dashboard
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
